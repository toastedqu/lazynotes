        - file: math/prob/stats.md
        - file: math/prob/process.md
        - file: math/prob/bayes.md
        - file: math/prob/sampling.md
      - file: math/info.md
      - file: math/decision.md
      - file: math/compute.md
      - title: Geometry
        children:
        - file: math/geo/topology.md
        - file: math/geo/manifold.md
        - file: math/geo/data.md
        - file: math/geo/highdim.md
        - file: math/geo/info.md
        - file: math/geo/ot.md
        - file: math/geo/symmetry.md
        - file: math/geo/repr.md
