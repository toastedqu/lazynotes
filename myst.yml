version: 1
project:
  title: Lazynotes
  authors:
    - name:
        literal: Q
  github: executablebooks/jupyter-book
  error_rules:
    ## Repo convention: cross-link via implicit heading anchors (lowercase-hyphen).
    - rule: reference-target-explicit
      severity: ignore
  bibliography:
    - references.bib
  numbering:
    equation: false
  exports:
    - format: pdf
      template: plain_latex_book
      output: exports/book.pdf
  toc:
